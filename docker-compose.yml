services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: akalan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: akalan
      POSTGRES_PASSWORD: akalan
      POSTGRES_DB: akalan_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akalan -d akalan_portal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
